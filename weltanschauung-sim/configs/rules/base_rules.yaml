game_id: weltanschauung_base
player_count: 4

factions:
  - id: red
    name: Red
    start_population: 5
    eliminated_at_start: false
  - id: black
    name: Black
    start_population: 5
    eliminated_at_start: false
  - id: yellow
    name: Yellow
    start_population: 5
    eliminated_at_start: false
  - id: green
    name: Green
    start_population: 5
    eliminated_at_start: false

population:
  total_population: 100
  neutral_start: 80

players:
  - id: P1
    seat: 0
    faction_id: red
  - id: P2
    seat: 1
    faction_id: black
  - id: P3
    seat: 2
    faction_id: yellow
  - id: P4
    seat: 3
    faction_id: green

roles:
  start_player: random
  first_journalist: left_of_start_player
  first_media_mogul: normal_rules
  saboteur:
    enabled: false
    count: 0

propaganda:
  slots: 3
  overflow: remove_oldest
  journalist_options:
    - discard_one
    - place_one_on_top_of_deck
    - remove_one_propaganda_card_from_game
  media_mogul_draw_count: 2
  media_mogul_choice_count: 2
  allowed_sources_for_propaganda: both
  media_mogul_card_source: hand
  media_mogul_card_types:
    - propaganda
    - hybrid

round_flow:
  max_rounds: 12
  phases:
    - start_round
    - draft
    - journalist_phase
    - media_mogul_phase
    - planning
    - reveal
    - action_resolution
    - cleanup
    - victory_check

draft:
  enabled: true
  starting_hand_size: 5
  hidden_research_orders: 2
  max_sources: 3
  draw_count: 1
  pick_count: 1
  pass_count: 0
  last_player_discard_count: 0
  direction: clockwise

victory:
  check_timing:
    - after_population_change
    - end_of_round
    - game_end
  faction_win_mode: highest_population_at_game_end
  tie_breakers: shared_win
  saboteur_win_conditions:
    - type: destroyed_population_at_least
      threshold: 100
    - type: all_factions_zero

analytics:
  outputs_dir: outputs/runs
  event_log_format: jsonl
  save_all_events: false
  save_last_n_games_events: 1000
  save_interesting_games: true
  faction_winrate_min: 0.18
  faction_winrate_max: 0.35
  saboteur_winrate_max: 0.20
  player_position_advantage_max: 0.35
  average_rounds_min: 6
  average_rounds_max: 12
  early_decision_rate_max: 0.25
  useless_card_rate_max: 0.60
  overpowered_card_delta_max: 20
  propaganda_slot_dominance_max: 0.55
  research_order_completion_min: 0.10
  fallback_decision_rate_max: 0.15

cards: []
bots: []
