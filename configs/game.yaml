  max_rounds: 8
  phases:
    - draft
    - planning
    - resolution
    - upkeep
action_types:
  - id: campaign
    label: Campaign
    population_delta: 1
    requires_target_faction: true
  - id: attack
    label: Attack
    population_delta: -1
    requires_target_faction: true
  - id: support
    label: Support
    population_delta: 1
    requires_target_faction: true
victory_conditions:
  - id: population_threshold
    type: faction_population_at_least
    threshold: 12
  - id: round_limit_highest_population
    type: highest_population_at_round_limit

